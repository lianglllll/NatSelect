syntax = "proto3";
package NatSelect.Protobuf.Interval;
option csharp_namespace = "NatSelect.Protobuf.Interval";

// 引擎传输协议定义。
// 原则：本文件只允许定义引擎内部传输协议（Envelope），禁止添加任何业务消息。
// 业务协议由上层项目定义，并通过 ProtoHelper.Register 注入引擎。

message NatSelectEnvelope
{
	uint64 sender_node_id	= 1;
	uint64 sender_actor_id	= 2;
	uint64 target_node_id	= 3;
	uint64 target_actor_id	= 4;
	uint64 sequence_id		= 5;
	bytes payload			= 6;
	uint64 payload_type		= 7;
}
